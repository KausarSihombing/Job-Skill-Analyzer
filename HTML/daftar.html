<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Job Skill Analyzer</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="/CSS/daftar.css">
</head>
<body>
    <div class="login-container">
        
        <div class="login-box kotak-daftar">
            
            <a href="../index.html" class="btn-kembali">
                <span class="material-icons">arrow_back</span> Kembali
            </a>

            <div class="header-login">
                <h2>Buat Akun</h2>
                <p>Bergabunglah bersama kami sekarang</p>
            </div>

            <form action="#" id="form-daftar">
        
                <div class="grup-sejajar">
                    <div class="grup-input">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" placeholder="Nama..." required>
                    </div>

                    <div class="grup-input">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email..." required>
                    </div>
                </div>

                <div class="grup-input">
                    <label for="pw">Password</label>
                    <input type="password" id="pw" placeholder="Buat password..." required>
                </div>

                <div class="grup-input">
                    <label for="pw-konfirm">Konfirmasi Password</label>
                    <input type="password" id="pw-konfirm" placeholder="Ulangi password..." required>
                </div>

    
                <div class="opsi-tambahan kotak-syarat">
                    <label class="ingatkan-saya">
                        <input type="checkbox" required> Saya setuju dengan <a href="#">Syarat & Ketentuan</a>
                    </label>
                </div>

                <button type="submit" class="btn-utama">Daftar Sekarang</button>
                
                <p class="teks-bawah">Sudah punya akun? <a href="/HTML/login.html">Masuk di sini</a></p>
            </form>

        </div>
    </div>
    <script src="/JS/daftar.js"></script>
</body>
</html>
